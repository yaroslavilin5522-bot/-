<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход на сайт...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
        video { position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%; width: auto; height: auto; transform: translate(-50%, -50%); object-fit: cover; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 10; color: white; cursor: pointer; text-align: center; padding: 20px; }
        .btn { padding: 15px 30px; font-size: 18px; border: 2px solid #fff; background: transparent; color: #fff; border-radius: 25px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="overlay" onclick="startRickroll()">
        <button class="btn">Перейти на сайт</button>
    </div>
    <video id="rick" loop playsinline muted>
        <source src="https://archive.org" type="video/mp4">
    </video>
    <script>
        const video = document.getElementById('rick');
        video.play().catch(e => console.log("Ждем клика"));
        function startRickroll() {
            document.getElementById('overlay').style.display = 'none';
            video.muted = false;
            video.play();
        }
    </script>
</body>
</html>
